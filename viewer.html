<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6b1a3a">
<title>Torneo Sagra del CEO — Live</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<style>
:root {
  --accent: #b8386c;
  --accent-light: #e0578e;
  --accent-dark: #6b1a3a;
  --yellow: #ffd166;
  --red: #ff5a5a;
  --bg: #1a0d12;
  --bg2: #2e131d;
  --bg3: #3d1826;
  --border: #6b3049;
  --text: #fbeef2;
  --text2: #d9b3c1;
  --text3: #b57d95;
  --white: #ffffff;
  --radius: 10px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.ig-icon {
  background: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

body {
  font-family: 'Barlow', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.header {
  background: var(--bg2);
  border-bottom: 2px solid var(--accent-dark);
  padding: 1rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
}

.header-icon {
  display: flex;
  align-items: center;
}

.header-icon img {
  height: 3rem;
  width: auto;
  display: block;
}

.header-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.9rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--white);
  line-height: 1;
}

.header-sub {
  font-size: 13px;
  color: var(--text3);
  letter-spacing: .05em;
  text-transform: uppercase;
  margin-top: 2px;
}

.header-badge {
  margin-left: auto;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: #70c97e;
  background: rgba(40,120,60,.2);
  border: 1px solid rgba(40,120,60,.4);
  border-radius: 20px;
  padding: 4px 12px;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 5px;
}

.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #70c97e;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%,100% { opacity:1 }
  50% { opacity:.3 }
}

.nav {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  overflow-x: auto;
  padding: 0 1rem;
  gap: 2px;
}

.nav-btn {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .05em;
  padding: 12px 18px;
  border: none;
  background: none;
  color: var(--text3);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  transition: color .15s;
}

.nav-btn:hover {
  color: var(--text2);
}

.nav-btn.active {
  color: var(--accent-light);
  border-bottom-color: var(--accent-light);
}

.main {
  padding: 1.25rem;
  max-width: 900px;
  margin: 0 auto;
}

.section {
  display: none;
}

.section.active {
  display: block;
}

.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  margin-bottom: .75rem;
}

.card-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--accent-light);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 6px;
}

.grid3 {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: .75rem;
}

@media(max-width:640px) {
  .grid3 {
    grid-template-columns: 1fr;
  }
}

.match-block {
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.match-block:last-child {
  border-bottom: none;
}

.match-top-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:7px;
}

.match-dt-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--yellow);
  font-style: normal;
  display: flex;
  align-items: center;
  gap: 5px;
}

.match-status {
  font-size: 10px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:3px 8px;
  border-radius:999px;
  border:1px solid var(--border);
}

.match-status.played {
  color:#70c97e;
  background:rgba(40,120,60,.18);
  border-color:rgba(40,120,60,.35);
}

.match-status.pending {
  color:var(--text2);
  background:rgba(255,255,255,.04);
}

.match-status.live {
  color:#ff7a7a;
  background:rgba(224,64,64,.16);
  border-color:rgba(224,64,64,.45);
  display:inline-flex;
  align-items:center;
  gap:5px;
}

.live-dot-sm {
  width:6px;
  height:6px;
  border-radius:50%;
  background:#ff5a5a;
  animation: pulse 1.2s infinite;
}

.match-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 12px;
  align-items: center;
  margin-bottom: 8px;
}

.team-name {
  font-weight: 600;
  font-size: 14px;
  color: var(--text);
}

.team-name.right {
  text-align: right;
}

.score-display {
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: center;
}

.score-box {
  min-width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 26px;
  font-weight: 900;
  color: var(--white);
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
}

.score-box.pending {
  color: var(--text3);
}

.score-sep {
  font-size: 18px;
  color: var(--text3);
  font-weight: 700;
}

.cards-info-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
}

.cards-info {
  font-size: 12px;
  color: var(--text2);
}

.winner-label {
  text-align: center;
  font-size: 12px;
  color: var(--text2);
  margin-top: 4px;
}

.winner-label strong {
  color: var(--accent-light);
}

.ev-list-view {
  margin-top: 6px;
}

.ev-item-view {
  font-size: 12px;
  color: var(--text2);
  padding: 2px 0;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--text3);
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  text-align: left;
}

td {
  padding: 7px 10px;
  border-bottom: 1px solid var(--border);
}

tr:last-child td {
  border-bottom: none;
}

.tr-gold td {
  background: rgba(155,45,90,.15);
}

.tr-silver td {
  background: rgba(255,255,255,.03);
}

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  text-transform: uppercase;
}

.badge-qf {
  background: rgba(155,45,90,.25);
  color: var(--accent-light);
  border: 1px solid var(--accent-dark);
}

.no-data {
  text-align: center;
  padding: 2rem;
  color: var(--text3);
  font-size: 14px;
}

.refresh-bar {
  background: var(--bg3);
  border-bottom: 1px solid var(--border);
  padding: 6px 1.5rem;
  font-size: 12px;
  color: var(--text3);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.refresh-bar button {
  font-size: 11px;
  padding: 3px 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: none;
  color: var(--text2);
  cursor: pointer;
}

.refresh-bar button:hover {
  border-color: var(--accent-light);
  color: var(--accent-light);
}

/* --- Edizioni e Albo d'oro --- */
.season-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 1.5rem;background:var(--bg3);border-bottom:1px solid var(--border);color:var(--text2)}
.season-bar select{width:auto;min-width:105px;padding:6px 10px;font-weight:700;color:var(--yellow)}
.season-pill{display:inline-flex;align-items:center;padding:4px 10px;border:1px solid var(--border);border-radius:999px;font-size:12px}.season-pill.current{color:#70c97e}.season-pill.archive{color:var(--yellow)}
.season-back{padding:5px 10px!important;font-size:12px!important}.archive-warning{background:rgba(255,209,102,.10);border:1px solid rgba(255,209,102,.35);color:#ffe6a6;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.honors-subnav{display:flex;overflow-x:auto;gap:4px;margin-bottom:14px}.honors-subnav button{border:1px solid var(--border);background:var(--bg3);color:var(--text2);border-radius:7px;padding:8px 12px;cursor:pointer;white-space:nowrap}.honors-subnav button.active{background:var(--accent);border-color:var(--accent);color:white}
.honors-note{font-size:13px;color:var(--text3);margin:-5px 0 12px}.honors-empty{text-align:center;color:var(--text3);padding:20px}.hidden{display:none!important}
@media(max-width:640px){.season-bar{padding:8px 12px}.season-label{display:none}.honors-table-wrap{overflow-x:auto}}


/* Correzione menu edizione */
.season-bar select{appearance:auto!important;background-color:var(--bg3)!important;color:var(--yellow)!important;border:1px solid var(--accent)!important;box-shadow:none!important;font-weight:700!important}
.season-bar select option{background:var(--bg2)!important;color:var(--text)!important}
.season-back{background:var(--bg3)!important;color:var(--text)!important;border-color:var(--border)!important}


/* ---- UX: telefono, tastiera, stati ---- */
:focus-visible{outline:3px solid #ffd54a;outline-offset:2px}
#load-state{max-width:520px;margin:48px auto;padding:0 20px;text-align:center;color:var(--text2)}
#load-state .spin{width:34px;height:34px;margin:0 auto 14px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:ls-spin 1s linear infinite}
@keyframes ls-spin{to{transform:rotate(360deg)}}
#load-state button{margin-top:14px;min-height:44px;padding:10px 22px;border-radius:10px;border:1px solid var(--accent);background:var(--bg3);color:var(--text);font-weight:700;font-size:1rem;cursor:pointer}
.nav-wrap{position:relative}
@media(max-width:640px){
 .header{padding:.7rem 1rem;gap:.7rem}
 .header-icon img{height:2.4rem}
 .header-title{font-size:1.3rem;line-height:1.05}
 .header-badge{font-size:12px;padding:4px 10px}
 .refresh-bar{padding:6px 12px}
 .refresh-bar button,.season-bar select,.season-bar .btn{min-height:44px;font-size:15px}
 .refresh-bar button{padding:8px 16px}
 .nav{-webkit-mask-image:linear-gradient(to right,#000 90%,transparent);mask-image:linear-gradient(to right,#000 90%,transparent);padding-right:28px}
 .nav-btn{min-height:44px}
 .honors-subnav button{min-height:44px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation-duration:.01ms!important;scroll-behavior:auto!important}}

/* =========================================================
   RIORGANIZZAZIONE: tema chiaro con accenti bordeaux,
   navigazione a barra inferiore su telefono
   ========================================================= */
:root{
  --accent:#8f1f4d;--accent-light:#b8386c;--accent-dark:#6b1a3a;
  --yellow:#8a5a00;--red:#c62828;
  --bg:#f7f2f4;--bg2:#ffffff;--bg3:#f4eaef;--border:#e4d4dc;
  --text:#2a1520;--text2:#5e3f4d;--text3:#7a5667;--white:#ffffff;--radius:12px;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-size:16px;line-height:1.35}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent)!important;outline-offset:2px}

/* testata */
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#6b1a3a,#8f1f4d);color:#fff}
.topbar-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;min-width:0;flex:1}
.brand img{height:34px;width:auto;flex:0 0 auto}
.brand b{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.05rem;letter-spacing:.03em;text-transform:uppercase;line-height:1.05}
.brand small{display:block;font-size:.8rem;opacity:.9}
#season-select{flex:0 0 auto;width:92px;min-height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);color:#fff;font:700 .95rem 'Barlow',sans-serif;padding:0 8px;appearance:auto}
#season-select option{color:#2a1520;background:#fff}
.archive-banner{background:#fff4d6;color:#5a3d00;border-bottom:1px solid #ecd48e;padding:4px 16px;font-size:.88rem;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.archive-banner button{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid #8a5a00;background:#fff;color:#5a3d00;font:700 .9rem 'Barlow',sans-serif;cursor:pointer}

/* barra inferiore */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(60,20,40,.08)}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;color:var(--text3);text-decoration:none;font-size:.74rem;font-weight:700}
.bottom-nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bottom-nav a.active{color:var(--accent)}
.bottom-nav a.active svg{stroke-width:2.4}

.main{max-width:980px;margin:0 auto;padding:16px 16px calc(84px + env(safe-area-inset-bottom))}
.subbar{max-width:980px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:8px}
.subbar a,.backlink{display:inline-flex;align-items:center;min-height:44px;color:var(--accent);font-weight:700;text-decoration:none;font-size:1rem}
.subbar h1{font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;text-transform:uppercase;letter-spacing:.03em;font-weight:800}
.foot{max-width:980px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom));color:var(--text3);font-size:.82rem;text-align:center}
.section{display:none}.section.active{display:block}

/* schede e tabelle esistenti (marcatori, social, albo) */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px 10px;margin-bottom:14px;box-shadow:none}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:1.15rem;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-weight:800}
.no-data,.empty{text-align:center;color:var(--text3);padding:28px 12px}
.empty .btn,.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;margin-top:10px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:700 1rem 'Barlow',sans-serif;text-decoration:none;cursor:pointer}
.btn.sm{margin:0;min-height:40px;padding:0 14px;font-size:.9rem}

/* hero e numeri */
.hero{background:linear-gradient(135deg,#6b1a3a,#8f1f4d);color:#fff;border-radius:16px;padding:18px;margin-bottom:14px}
.hero-k{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;opacity:.9;font-weight:700}
.hero h1{font-family:'Barlow Condensed',sans-serif;font-size:2.1rem;line-height:1.05;margin:6px 0 4px;text-transform:uppercase;font-weight:800;overflow-wrap:anywhere}
.hero-sub{opacity:.92;font-size:.98rem}
.hero.done .hero-sub{font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.82rem;margin-top:8px}
.podium{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.podium span{background:rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;font-size:.88rem;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 4px;text-align:center}
.stat b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:1.65rem;line-height:1;color:var(--accent);font-weight:800}
.stat b small{font-size:1rem;color:var(--text3)}
.stat span{display:block;margin-top:3px;font-size:.7rem;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.03em}

/* blocchi e liste */
.blk{margin-bottom:20px}
.blk-h{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px;min-height:28px}
.blk-h h2{font-family:'Barlow Condensed',sans-serif;font-size:1.3rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text);font-weight:800}
.blk-h a{font-size:.92rem;font-weight:700;color:var(--accent);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.blk.final .mc{border-color:var(--accent);border-width:2px}
.list{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border-top:1px solid var(--border);color:var(--text);text-decoration:none}
.li:first-child{border-top:0}
a.li:active{background:var(--bg3)}
.li .n{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.li small{display:block;color:var(--text3);font-weight:500;font-size:.82rem;margin-top:1px}
.li .v{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.3rem;color:var(--accent);white-space:nowrap}
.li .chev{color:var(--text3);font-size:1.4rem}
.li .pstat{font-size:.85rem;color:var(--text2);white-space:nowrap}
.rank{width:24px;text-align:center;color:var(--text3);font-weight:800;flex:0 0 auto}
.chip-on{font-size:.82rem;font-weight:700;color:var(--accent);background:var(--bg3);border-radius:999px;padding:5px 12px}

/* scheda partita */
.mc{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px 8px;margin-bottom:10px}
.mc.live{border-color:var(--accent);box-shadow:0 0 0 3px rgba(143,31,77,.14)}
.mc.tbd .mc-t{color:var(--text3);font-weight:600}
.mc-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.82rem;color:var(--text3);font-weight:700;margin-bottom:8px}
.mc-badge{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;border-radius:999px;padding:3px 9px;background:var(--bg3);color:var(--text2);white-space:nowrap}
.mc-badge.soft{background:transparent;border:1px solid var(--border)}
.mc-badge.live{background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:6px}
.mc-badge.live i{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.mc-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.mc-t{font-weight:600;font-size:.98rem;line-height:1.15;overflow-wrap:break-word;hyphens:manual}
.mc-t a{display:block;padding:10px 0;margin:-10px 0;color:inherit;text-decoration:none}
.mc-t.r{text-align:right}
.mc.played .mc-t:not(.win){color:var(--text2)}
.mc-t.win{font-weight:800}
.mc-s{display:flex;align-items:center;gap:6px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.75rem;min-width:76px;justify-content:center;background:var(--bg3);border-radius:10px;padding:2px 10px;line-height:1.25}
.mc-s span{color:var(--text3);font-size:1.2rem}
.mc.pending .mc-s b{color:var(--text3)}
.mc-adv{margin-top:6px;font-size:.88rem;color:var(--accent)}
.mc-det summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-size:.88rem;color:var(--accent);font-weight:700;list-style:none}
.mc-det summary::-webkit-details-marker{display:none}
.mc-det summary::after{content:'▾';margin-left:6px}
.mc-det[open] summary::after{content:'▴'}

/* adattamento di marcatori, social e albo al tema chiaro */

<script>
/* Stato di caricamento: prima i contenuti restavano vuoti senza alcun messaggio */
(function(){
  var main=document.querySelector('main.main'); if(!main) return;
  var box=document.createElement('div'); box.id='load-state'; box.setAttribute('role','status');
  box.innerHTML='<div class="spin" aria-hidden="true"></div><p>Caricamento dei risultati…</p>';
  main.insertBefore(box,main.firstChild);
  function filled(){return [].some.call(main.querySelectorAll('.section'),function(s){return s.childNodes.length>0&&s.textContent.trim().length>0});}
  function done(){box.remove();mo.disconnect();clearTimeout(t);}
  var mo=new MutationObserver(function(){if(filled())done();});
  mo.observe(main,{childList:true,subtree:true,characterData:true});
  var t=setTimeout(function(){
    if(!filled()){box.setAttribute('role','alert');box.innerHTML='<p><b>Non riesco a caricare i risultati.</b></p><p>Controlla la connessione e riprova.</p><button type="button" onclick="location.reload()">Riprova</button>';}
  },10000);
  /* indica al lettore di schermo la scheda attiva */
  var nav=document.querySelector('.nav');
  function sync(){[].forEach.call(nav.querySelectorAll('.nav-btn'),function(b){b.classList.contains('active')?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current');});}
  if(nav){nav.setAttribute('aria-label','Sezioni del torneo');nav.addEventListener('click',function(){setTimeout(sync,0)});sync();}
})();
</script>

<script src="https://www.gstatic.com/firebasejs/12.2.0/firebase-database-compat.js"></script>

<script>

const GIRONI=['A','B','C'];

const PAIRS=[
  [0,1],
  [2,3],
  [0,2],
  [1,3],
  [0,3],
  [1,2]
];

const KO_PHASES=[
  {
    phase:'QF',
    label:'Quarti di Finale',
    n:4,
    hints:[
      '1°A vs 2°B',
      '1°B vs 2°C',
      '1°C vs 2°A',
      'Wildcard'
    ]
  },
  {
    phase:'SF',
    label:'Semifinali',
    n:2,
    hints:[
      'Vin. QF1 vs Vin. QF2',
      'Vin. QF3 vs Vin. QF4'
    ]
  },
  {
    phase:'F3',
    label:'Finale 3°/4° Posto',
    n:1,
    hints:[
      'Perd. SF1 vs Perd. SF2'
    ]
  },
  {
    phase:'F',
    label:'Finale',
    n:1,
    hints:[
      'Vin. SF1 vs Vin. SF2'
    ]
  }
];

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCAanAjlnNDfSq5JJ7gYDv3ycpfrLahiOI",
  authDomain: "torneo-chievo.firebaseapp.com",
  databaseURL: "https://torneo-chievo-default-rtdb.firebaseio.com",
  projectId: "torneo-chievo",
  storageBucket: "torneo-chievo.firebasestorage.app",
  messagingSenderId: "1006116681466",
  appId: "1:1006116681466:web:9080aa5572363be37c3b43"
};

const app = firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();
const ROOT_REF = db.ref('torneo_ceo_v2');
const CURRENT_SEASON='2027';
let selectedSeason=CURRENT_SEASON;
let stateRef=ROOT_REF.child('seasons/'+selectedSeason+'/tournament');
let currentSyncHandler=null;
let ALL_SEASONS={};

let S=null;

function toArr(v){
  if(Array.isArray(v)) return v;

  if(v === null || v === undefined) return [];

  if(typeof v === 'object') return Object.values(v);

  return [];
}

function normalizeState(v){

  const src=(v && typeof v==='object') ? v : {};

  const squadre={
    A:[],
    B:[],
    C:[]
  };

  GIRONI.forEach(g=>{

    const arr=toArr(src.squadre && src.squadre[g]);

    squadre[g]=Array.from(
      {length:4},
      (_,i)=>{

        const sq=arr[i] || {};

        const players=toArr(sq.players)
          .map(p=>{

            if(p && typeof p==='object'){
              return {
                n:(p.n===undefined||p.n===null)?'':p.n,
                name:String(p.name||'')
              };
            }

            return {
              n:'',
              name:String(p||'')
            };

          })
          .filter(p=>p.name);

        return {
          name:sq.name || '',
          players
        };
      }
    );

  });

  const matches=
    (src.matches && typeof src.matches==='object')
      ? src.matches
      : {};

  Object.keys(matches).forEach(k=>{

    const m=matches[k] || {};

    matches[k]={
      evA:toArr(m.evA).filter(Boolean),
      evB:toArr(m.evB).filter(Boolean),
      dt:m.dt || '',
      played:!!m.played,
      live:!!m.live
    };

  });

  return {
    squadre,
    matches,
    koTeams:
      (src.koTeams && typeof src.koTeams==='object')
        ? src.koTeams
        : {},
    banco:
      (src.banco && typeof src.banco==='object')
        ? src.banco
        : {},
    social:
      (src.social && typeof src.social==='object')
        ? src.social
        : {}
  };
}

const mkey=(phase,idx)=>`${phase}_${idx}`;

const mdata=key=>{

  const m=(S?.matches&&S.matches[key])||{};

  return {
    evA:toArr(m.evA),
    evB:toArr(m.evB),
    dt:m.dt || '',
    played:!!m.played,
    live:!!m.live
  };
};

const sqName=(g,i)=>
  S?.squadre?.[g]?.[i]?.name || `Squadra ${g}${i+1}`;

const calcScore=m=>({

  goA:(m.evA||[]).filter(e=>e.t==='gol').length,
  goB:(m.evB||[]).filter(e=>e.t==='gol').length,

  giA:(m.evA||[]).filter(e=>e.t==='giallo').length,
  giB:(m.evB||[]).filter(e=>e.t==='giallo').length,

  roA:(m.evA||[]).filter(e=>e.t==='rosso').length,
  roB:(m.evB||[]).filter(e=>e.t==='rosso').length

});

const fmtDt=v=>{

  if(!v) return '';

  const d=new Date(v);

  if(isNaN(d)) return '';

  const gg=String(d.getDate()).padStart(2,'0');
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const aa=d.getFullYear();

  const hh=String(d.getHours()).padStart(2,'0');
  const mi=String(d.getMinutes()).padStart(2,'0');

  return `${gg}/${mm}/${aa} ${hh}:${mi}`;
};

const isVisible=m=>
  !!(m && (m.played || m.live));

const scoreText=(m,side)=>
  isVisible(m)
    ? calcScore(m)[side]
    : '–';

const statusBadge=m=>

  m.played

    ? '<span class="match-status played">Giocata</span>'

    : (
        m.live

          ? '<span class="match-status live"><span class="live-dot-sm"></span>In corso</span>'

          : '<span class="match-status pending">Da giocare</span>'
      );

function populateSeasonMenu(){
  ROOT_REF.once('value').then(snap=>{
    const root=snap.val()||{};
    ALL_SEASONS=root.seasons||{};window.__ROOT_DATA=root;
    const years=(root.config&&root.config.availableSeasons)||['2027','2026'];
    const sel=document.getElementById('season-select');
    sel.innerHTML=years.map(y=>`<option value="${y}">${y}</option>`).join('');
    sel.value=selectedSeason;
    updateSeasonUI();
  }).catch(err=>{console.error(err);document.getElementById('last-update').textContent='Errore caricamento stagioni';});
}
function switchSeason(year){
  if(!year||year===selectedSeason)return;
  if(currentSyncHandler)stateRef.off('value',currentSyncHandler);
  selectedSeason=String(year);
  stateRef=ROOT_REF.child('seasons/'+selectedSeason+'/tournament');
  S=null;
  document.getElementById('season-select').value=selectedSeason;
  updateSeasonUI();
  subscribeLive();
}
function subscribeLive(){
  currentSyncHandler=snap=>{S=normalizeState(snap.val());loadAndRender();};
  stateRef.on('value',currentSyncHandler,err=>{console.error(err);document.getElementById('last-update').textContent='Errore nel caricamento live';});
  ROOT_REF.child('seasons').once('value').then(s=>{ALL_SEASONS=s.val()||{};if(document.querySelector('.section.active')?.id==='albo')renderAlbo();});
}

function getStandings(g){

  const st={};

  S.squadre[g].forEach((_,i)=>{

    const n=sqName(g,i);

    st[n]={
      pts:0,
      pg:0,
      gs:0,
      gc:0,
      gd:0,
      gi:0,
      ro:0
    };

  });

  PAIRS.forEach(([a,b],i)=>{

    const key=mkey(`G${g}`,i);

    const m=mdata(key);

    if(!m.played)
      return;

    const sc=calcScore(m);

    const ta=sqName(g,a);
    const tb=sqName(g,b);

    st[ta].pg++;
    st[tb].pg++;

    st[ta].gs+=sc.goA;
    st[ta].gc+=sc.goB;
    st[ta].gd+=sc.goA-sc.goB;

    st[tb].gs+=sc.goB;
    st[tb].gc+=sc.goA;
    st[tb].gd+=sc.goB-sc.goA;

    st[ta].gi+=sc.giA;
    st[ta].ro+=sc.roA;

    st[tb].gi+=sc.giB;
    st[tb].ro+=sc.roB;

    if(sc.goA>sc.goB){

      st[ta].pts+=3;

    }else if(sc.goA<sc.goB){

      st[tb].pts+=3;

    }else{

      st[ta].pts+=1;
      st[tb].pts+=1;

    }

  });

  return Object.entries(st)

    .sort(
      (a,b)=>
        b[1].pts-a[1].pts ||
        b[1].gd-a[1].gd ||
        b[1].gs-a[1].gs
    )

    .map(([n,s])=>({
      n,
      ...s
    }));

}


/* =========================================================
   RIORGANIZZAZIONE: navigazione a sezioni (Home, Partite,
   Classifiche, Squadre, Altro) sul modello dell'archivio BNC.
   La logica dei dati (normalizeState, getStandings, ecc.)
   resta quella di prima.
   ========================================================= */
const TABS=['home','partite','classifiche','squadre','altro','marcatori','social','albo'];
const SUB_TITLES={marcatori:'Marcatori e cartellini',social:'Coppa Social',albo:"Albo d'oro e premi"};
const UI={pf:'all',q:'',cs:'gironi'};
const $=id=>document.getElementById(id);
const enc=s=>encodeURIComponent(s);
const SHORT_PHASE={QF:'Quarti di finale',SF:'Semifinali',F3:'Finale 3°/4° posto',F:'Finale'};

/* ---------- date e orari ---------- */
const dayKey=v=>{const d=new Date(v);return isNaN(d)?'':d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const dayLabel=k=>{
  if(!k)return 'Da programmare';
  const d=new Date(k+'T12:00:00');
  const s=d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
  return s.charAt(0).toUpperCase()+s.slice(1);
};
const hm=v=>{const d=new Date(v);return isNaN(d)?'':String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const ts=v=>{const t=new Date(v).getTime();return isNaN(t)?null:t;};

/* ---------- elenco di tutte le partite ---------- */
function allMatches(){
  const out=[];let ord=0;
  GIRONI.forEach(g=>PAIRS.forEach(([a,b],i)=>{
    const key=mkey('G'+g,i);
    out.push({key,phase:'G'+g,label:'Girone '+g,ta:sqName(g,a),tb:sqName(g,b),m:mdata(key),ord:ord++,g});
  }));
  KO_PHASES.forEach(ph=>{
    for(let i=0;i<ph.n;i++){
      const key=mkey(ph.phase,i);
      const kt=S.koTeams&&S.koTeams[key];
      const parts=String(ph.hints[i]||'').split(' vs ');
      const ta=(kt&&kt.a)||parts[0]||'Da definire';
      const tb=(kt&&kt.b)||parts[1]||'Da definire';
      out.push({key,phase:ph.phase,label:SHORT_PHASE[ph.phase]||ph.label,ta,tb,m:mdata(key),ord:ord++,ko:true,tbd:!(kt&&kt.a&&kt.b)});
    }
  });
  return out;
}
function sortMatches(list){
  return list.slice().sort((x,y)=>{
    const a=ts(x.m.dt),b=ts(y.m.dt);
    if(a!==null&&b!==null&&a!==b)return a-b;
    if(a!==null&&b===null)return -1;
    if(a===null&&b!==null)return 1;
    return x.ord-y.ord;
  });
}
function winnerSide(o){
  if(!o.m.played)return null;
  const sc=calcScore(o.m);
  if(sc.goA===sc.goB)return null;
  return sc.goA>sc.goB?'A':'B';
}

/* ---------- scheda partita (usata ovunque) ---------- */
function evSummary(arr){
  const map={};
  toArr(arr).forEach(e=>{
    if(!e)return;
    const p=String(e.p||'').trim()||'—';
    const c=map[p]||(map[p]={gol:0,giallo:0,rosso:0});
    if(c[e.t]!==undefined)c[e.t]++;
  });
  return Object.entries(map).map(([p,c])=>{
    let s='';
    if(c.gol)s+='⚽'+(c.gol>1?'×'+c.gol:'');
    if(c.giallo)s+=' 🟨'+(c.giallo>1?'×'+c.giallo:'');
    if(c.rosso)s+=' 🟥'+(c.rosso>1?'×'+c.rosso:'');
    return `<li><span class="ev-ic">${s.trim()}</span> ${htmlEsc(p)}</li>`;
  }).join('');
}
function matchCard(o,opt){
  opt=opt||{};
  const m=o.m,sc=calcScore(m),vis=isVisible(m),w=winnerSide(o);
  const status=m.live?'live':(m.played?'played':'pending');
  const badge=m.live
    ?'<span class="mc-badge live"><i></i>In corso</span>'
    :(m.played?'<span class="mc-badge">Terminata</span>':'<span class="mc-badge soft">Da giocare</span>');
  const meta=[opt.noPhase?'':o.label,m.dt?(opt.withDate?dayLabel(dayKey(m.dt)).replace(/^[^ ]+ /,'')+' ':'')+hm(m.dt):''].filter(Boolean).join(' · ');
  const A=vis?sc.goA:'–',B=vis?sc.goB:'–';
  const lA=evSummary(m.evA),lB=evSummary(m.evB);
  const det=(lA||lB)
    ?`<details class="mc-det"><summary>Marcatori e cartellini</summary><div class="mc-cols"><ul>${lA}</ul><ul class="r">${lB}</ul></div></details>`:'';
  let adv='';
  if(o.ko&&w){
    const n=w==='A'?o.ta:o.tb;
    adv=`<div class="mc-adv">${o.phase==='F'?'🏆 Campione':(o.phase==='F3'?'3° posto':'Avanza')}: <b>${htmlEsc(n)}</b></div>`;
  }
  const link=n=>(opt.noLinks||o.tbd&&o.ko)?htmlEsc(n):`<a href="#squadre/${enc(n)}">${htmlEsc(n)}</a>`;
  return `<article class="mc ${status}${o.tbd&&!m.played?' tbd':''}">
    <div class="mc-meta"><span>${htmlEsc(meta)}</span>${badge}</div>
    <div class="mc-row">
      <div class="mc-t${w==='A'?' win':''}">${link(o.ta)}</div>
      <div class="mc-s"><b>${A}</b><span>:</span><b>${B}</b></div>
      <div class="mc-t r${w==='B'?' win':''}">${link(o.tb)}</div>
    </div>${adv}${det}</article>`;
}

/* ---------- statistiche ---------- */
function topScorers(){
  const map={};
  allMatches().forEach(o=>{
    [[o.m.evA,o.ta],[o.m.evB,o.tb]].forEach(([arr,team])=>toArr(arr).forEach(e=>{
      if(!e||e.t!=='gol')return;
      const raw=String(e.p||'');
      if(/AUTOGOL|VITTORIA AI RIGORI/i.test(raw))return;
      const name=raw.replace(/^#\d+\s*/,'').trim().toUpperCase();
      if(!name)return;
      const r=map[name]||(map[name]={name,team,g:0});
      r.g++;
    }));
  });
  return Object.values(map).sort((a,b)=>b.g-a.g||a.name.localeCompare(b.name));
}
function seasonMeta(){return (ALL_SEASONS&&ALL_SEASONS[selectedSeason])||{};}
function podiumNow(){
  const list=allMatches();
  const f=list.find(o=>o.phase==='F'),f3=list.find(o=>o.phase==='F3');
  const out={first:'',second:'',third:''};
  if(f&&winnerSide(f)){const w=winnerSide(f);out.first=w==='A'?f.ta:f.tb;out.second=w==='A'?f.tb:f.ta;}
  if(f3&&winnerSide(f3)){out.third=winnerSide(f3)==='A'?f3.ta:f3.tb;}
  if(!out.first){
    const p=toArr(seasonMeta().awards&&seasonMeta().awards.podium);
    if(p[0]){out.first=String(p[0]);out.second=String(p[1]||'');out.third=String(p[2]||'');}
  }
  return out.first?out:null;
}
function seasonStatus(list){
  const played=list.filter(o=>o.m.played).length,live=list.some(o=>o.m.live);
  const fin=list.find(o=>o.phase==='F');
  if(fin&&fin.m.played)return 'done';
  if(played>0||live)return 'running';
  return 'soon';
}

let lastHash=null;
function route(fromHash){
  if(!S)return;
  const h=(location.hash||'#home').slice(1);
  const base=h.split('/')[0];
  const tab=TABS.includes(base)?base:'home';
  document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===tab));
  const sub=['marcatori','social','albo'].includes(tab);
  $('subbar').classList.toggle('hidden',!sub);
  if(sub)$('sub-title').textContent=SUB_TITLES[tab];
  const navTab=sub?'altro':tab;
  document.querySelectorAll('.bottom-nav a').forEach(a=>{
    const on=a.dataset.tab===navTab;
    a.classList.toggle('active',on);
    if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');

  (renders[tab]||renders.home)();

}

function scorersData(){
  const per={},cards={};
  allMatches().forEach(o=>{
    if(!o.m.played)return;
    [[o.m.evA,o.tbd&&o.ko?'':o.ta],[o.m.evB,o.tbd&&o.ko?'':o.tb]].forEach(([arr,team])=>{
      if(team&&!cards[team])cards[team]={gi:0,ro:0};
      toArr(arr).forEach(e=>{
        if(!e)return;
        if(e.t==='giallo'&&team)cards[team].gi++;
        if(e.t==='rosso'&&team)cards[team].ro++;
        if(e.t!=='gol')return;
        const raw=String(e.p||'');
        if(/AUTOGOL|VITTORIA AI RIGORI/i.test(raw))return;
        const name=raw.replace(/^#\d+\s*/,'').trim().toUpperCase();
        if(!name)return;
        const k=name+'|'+team;
        const r=per[k]||(per[k]={name,team,g:0,ms:new Set()});
        r.g++;r.ms.add(o.key);
      });
    });
  });
  const list=Object.values(per).map(r=>({name:r.name,team:r.team,g:r.g,pg:r.ms.size})).sort((a,b)=>b.g-a.g||a.name.localeCompare(b.name));
  let rank=0,prev=null;
  list.forEach((r,i)=>{if(r.g!==prev){rank=i+1;prev=r.g;}r.rank=rank;});
  return {list,cards};
}

      <tbody>

  `;

  sorted.forEach((team,i)=>{

    const count=socialGet(team);

    const medal=
      i===0
        ? '🥇'
        : i===1
          ? '🥈'
          : i===2
            ? '🥉'
            : `${i+1}`;

    const rowCls=
      i===0
        ? 'tr-gold'
        : i===1
          ? 'tr-silver'
          : '';

    html+=`

      <tr class="${rowCls}">

        <td
          style="
            font-family:'Barlow Condensed',sans-serif;
            font-size:18px;
            font-weight:700
          "
        >
          ${medal}
        </td>

        <td>
          <strong>${team}</strong>
        </td>

        <td style="text-align:center">

          <span
            style="
              font-family:'Barlow Condensed',sans-serif;
              font-size:22px;
              font-weight:900;
              color:var(--yellow)
            "
          >
            ${count}
          </span>

        </td>

      </tr>

    `;

  });

  html+=`

      </tbody>

    </table>


    <div
      style="
        margin-top:1rem;
        text-align:center;
        font-size:12px;
        color:var(--text3)
      "
    >

      Totale punti social torneo:

      <strong style="color:var(--text2)">

        ${
          teams.reduce(
            (sum,team)=>
              sum+socialGet(team),
            0
          )
        }

      </strong>

    </div>

  `;

  c.innerHTML=html;

  el.appendChild(c);

}



function htmlEsc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function canonicalTeam(v){const x=String(v||'').trim().toUpperCase().replace(/\s+/g,' ');return {'ORTI SZ':'ORTI SAN ZENO','C.A. MUZZONI':'CA MUZZONI'}[x]||x;}
function scorerTotals(t){const out={};const matches=(t&&t.matches)||{};Object.values(matches).forEach(m=>[...toArr(m&&m.evA),...toArr(m&&m.evB)].forEach(e=>{if(!e||e.t!=='gol'||/AUTOGOL|VITTORIA AI RIGORI/i.test(e.p||''))return;const n=String(e.p||'').replace(/^#\d+\s*/,'').trim().replace(/\s+/g,' ').toUpperCase();if(n)out[n]=(out[n]||0)+1;}));return out;}
function renderAlbo(){
 const el=document.getElementById('albo'); if(!el)return; const seasons=Object.entries(ALL_SEASONS||{}).sort((a,b)=>Number(b[0])-Number(a[0]));
 el.innerHTML=`<div class="honors-subnav"><button class="active" onclick="renderAlboSub('podi',this)">Podi per anno</button><button onclick="renderAlboSub('squadre',this)">Titoli e premi squadra</button><button onclick="renderAlboSub('individuali',this)">Premi individuali</button><button onclick="renderAlboSub('marcatori',this)">Marcatori all time</button></div><div id="albo-content"></div>`;
 window.__honorsSeasons=seasons;renderAlboSub('podi',el.querySelector('button'));
}
function renderAlboSub(kind,btn){
 document.querySelectorAll('.honors-subnav button').forEach(b=>b.classList.toggle('active',b===btn));const el=document.getElementById('albo-content'),seasons=window.__honorsSeasons||[];
 if(kind==='podi'){el.innerHTML=`<div class="card"><div class="card-title">Podi per edizione</div><div class="honors-table-wrap"><table><thead><tr><th>Edizione</th><th>Campione</th><th>Secondo</th><th>Terzo</th></tr></thead><tbody>${seasons.map(([y,s])=>{const p=(s.awards&&s.awards.podium)||['','',''];return `<tr><td><strong>${y}</strong></td>${[0,1,2].map(i=>`<td>${htmlEsc(p[i]||'Da assegnare')}</td>`).join('')}</tr>`}).join('')}</tbody></table></div></div>`;return;}
 if(kind==='individuali'){el.innerHTML=seasons.map(([y,s])=>{const a=(s.awards&&s.awards.individual)||[];return `<div class="card"><div class="card-title">${y}</div>${a.length?`<table><thead><tr><th>Premio</th><th>Vincitore</th><th>Squadra</th></tr></thead><tbody>${a.map(x=>`<tr><td>${htmlEsc(x.type)}</td><td><strong>${htmlEsc(x.person)}</strong></td><td>${htmlEsc(x.team)}</td></tr>`).join('')}</tbody></table>`:'<div class="honors-empty">Premi da assegnare</div>'}</div>`}).join('');return;}
 if(kind==='squadre'){const t={};seasons.forEach(([y,s])=>{const a=s.awards||{};(a.podium||[]).forEach((n,i)=>{n=canonicalTeam(n);if(!n)return;t[n]??={win:0,second:0,third:0,banco:0,social:0};if(i===0)t[n].win++;if(i===1)t[n].second++;if(i===2)t[n].third++;});(a.team||[]).forEach(x=>{const n=canonicalTeam(x.team);if(!n)return;t[n]??={win:0,second:0,third:0,banco:0,social:0};if(x.type==='Coppa Banco')t[n].banco++;if(x.type==='Coppa Social')t[n].social++;});});const rows=Object.entries(t).sort((a,b)=>b[1].win-a[1].win||b[1].banco+b[1].social-a[1].banco-a[1].social);el.innerHTML=`<div class="card"><div class="card-title">Titoli e premi di squadra</div><div class="honors-table-wrap"><table><thead><tr><th>Squadra</th><th>Titoli</th><th>2°</th><th>3°</th><th>Banco</th><th>Social</th></tr></thead><tbody>${rows.map(([n,x])=>`<tr><td><strong>${htmlEsc(n)}</strong></td><td>${x.win}</td><td>${x.second}</td><td>${x.third}</td><td>${x.banco}</td><td>${x.social}</td></tr>`).join('')}</tbody></table></div></div>`;return;}
 if(kind==='marcatori'){const all={};const hist=(window.__ROOT_DATA&&window.__ROOT_DATA.historicalScorers)||{};Object.values(hist).forEach(year=>Object.entries(year||{}).forEach(([n,v])=>all[String(n).toUpperCase()]=(all[String(n).toUpperCase()]||0)+Number(v||0)));seasons.forEach(([y,s])=>Object.entries(scorerTotals(s.tournament||{})).forEach(([n,v])=>all[n]=(all[n]||0)+v));const rows=Object.entries(all).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));el.innerHTML=`<div class="card"><div class="card-title">Classifica marcatori all time</div><div class="honors-note">Classifica aggregata con i gol completi del 2024 e i gol registrati digitalmente dal 2026. I dati 2025 saranno aggiunti quando disponibili.</div><table><thead><tr><th>#</th><th>Giocatore</th><th>Gol</th></tr></thead><tbody>${rows.map(([n,v],i)=>`<tr class="${i===0?'tr-gold':''}"><td>${i+1}</td><td><strong>${htmlEsc(n)}</strong></td><td>${v}</td></tr>`).join('')}</tbody></table></div>`;}
}

const renders={home:renderHome,partite:renderPartite,classifiche:renderClassifiche,squadre:renderSquadre,altro:renderAltro,marcatori:renderMarcatori,social:renderSocial,albo:renderAlbo};

populateSeasonMenu();
subscribeLive();

</script>
