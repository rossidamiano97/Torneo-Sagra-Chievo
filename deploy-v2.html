<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Inizializza Torneo v2</title><style>body{font:16px Arial;max-width:720px;margin:40px auto;padding:20px}button,input{padding:12px;margin:6px}pre{padding:15px;background:#eee;white-space:pre-wrap}</style></head><body><h1>Inizializzazione Torneo v2</h1><p>Scrive esclusivamente nel nuovo nodo <b>torneo_ceo_v2</b>. Il nodo storico <b>torneo_ceo</b> non viene modificato. Serve l'accesso admin.</p><input type="email" id="email" placeholder="Email admin" autocomplete="username"><input type="password" id="pwd" placeholder="Password" autocomplete="current-password"><br><input type="file" id="file" accept=".json"><button id="run">Inizializza</button><pre id="out">Seleziona torneo-ceo-v2-initial.json</pre><script src="https://www.gstatic.com/firebasejs/12.2.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.2.0/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.2.0/firebase-auth-compat.js"></script><script>firebase.initializeApp({apiKey:"AIzaSyCAanAjLnNDFsq5JJ7gYDv3ycpfrLahiOI",authDomain:"torneo-chievo.firebaseapp.com",databaseURL:"https://torneo-chievo-default-rtdb.firebaseio.com",projectId:"torneo-chievo",appId:"1:1006116681466:web:9080aa5572363be37c3b43"});run.onclick=async()=>{try{const f=file.files[0];if(!f)throw Error('Seleziona il JSON');const d=JSON.parse(await f.text());await firebase.auth().signInWithEmailAndPassword(email.value.trim(),pwd.value);if(!confirm('Creare o sostituire SOLO torneo_ceo_v2? torneo_ceo resterà invariato.'))return;await firebase.database().ref('torneo_ceo_v2').set(d);out.textContent='Operazione completata. torneo_ceo non è stato modificato.'}catch(e){out.textContent='ERRORE: '+e.message}}</script></body></html>
