function cloneState(v){

      });

function normalizeState(v){
  const base = initState();
  const src = (v && typeof v === 'object') ? v : {};
  const out = {
    squadre: {A:[], B:[], C:[]},
    matches: (src.matches && typeof src.matches === 'object') ? src.matches : {},
    koTeams: (src.koTeams && typeof src.koTeams === 'object') ? src.koTeams : {},
    banco: (src.banco && typeof src.banco === 'object') ? src.banco : {},
    social: (src.social && typeof src.social === 'object') ? src.social : {}
  };
  GIRONI.forEach(g => {
    const arr = toArr(src.squadre && src.squadre[g]);
    out.squadre[g] = Array.from({length:4}, (_,i) => {
      const sq = arr[i] || base.squadre[g][i];
      return {
        name: (sq && sq.name) ? String(sq.name) : '',
        players: normPlayers(sq && sq.players)
      };
    });
  });
  Object.keys(out.matches).forEach(k => {
    const m = out.matches[k] || {};
    out.matches[k] = {
      evA: toArr(m.evA).filter(Boolean),
      evB: toArr(m.evB).filter(Boolean),
      dt: m.dt || '',
      played: !!m.played,
      live: !!m.live
    };
  });
  Object.keys(out.koTeams).forEach(k => {
    const t = out.koTeams[k] || {};
    out.koTeams[k] = { a: t.a || '', b: t.b || '' };
  });
  return out;
}

function mergePresetIntoState(base){
  const out = normalizeState(base || initState());
  let idx=0;
  GIRONI.forEach(g => {
    for(let i=0;i<4;i++){
      const t=TEAM_PRESET[idx++];
      if(t) out.squadre[g][i] = { name:t.name, players:t.players.map(p=>({n:(p.n===undefined?'':p.n),name:p.name})) };
    }
  });
  Object.entries(SCHEDULE_PRESET).forEach(([key, dt]) => {
    if(!out.matches[key]) out.matches[key] = {evA:[], evB:[], dt:''};
    out.matches[key].dt = dt;
  });
  return out;
}

function normName(s){
  return String(s||'')
    .toLowerCase()
    .replace(/['`.]/g,'')
    .replace(/\s+/g,' ')
    .trim();
}
// Legge una distinta (un foglio = una squadra): nome in A1, giocatori dalla riga con header "NOME GIOCATORE", col A=numero, col B=nome
function parseSheet(ws){
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});
  if(!rows.length) return null;
  const teamName = String((rows[0] && rows[0][0]) || '').trim();
  if(!teamName) return null;
  // trova la riga header (colonna B contiene "NOME GIOCATORE")
  let hdr = -1;
  for(let r=0; r<Math.min(rows.length,15); r++){
    const b = String((rows[r] && rows[r][1]) || '').trim().toUpperCase();
    if(b === 'NOME GIOCATORE'){ hdr = r; break; }
  }
  if(hdr === -1) hdr = 2; // fallback: header in riga 3 (indice 2)
  const FOOTER = ['allenatore:','canzone squadra:','totale giocatori:'];
  const players = [];
  for(let r=hdr+1; r<rows.length; r++){
    const row = rows[r] || [];
    const numRaw = row[0];
    const nameRaw = row[1];
    const numLabel = String(numRaw||'').trim().toLowerCase();
    if(FOOTER.includes(numLabel)) break;
    const name = String(nameRaw||'').trim();
    if(!name) continue;
    if(FOOTER.includes(name.toLowerCase())) break;
    let n = '';
    if(numRaw!==null && numRaw!==undefined && String(numRaw).trim()!==''){
      const parsed = parseInt(numRaw);
      n = isNaN(parsed) ? '' : parsed;
    }
    players.push({n:n, name:name});
  }
  return {name:teamName, players:players};
}
function importaExcel(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file){ return; }
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      // costruisci elenco squadre dal file
      const teamsFromFile = [];
      wb.SheetNames.forEach(sn => {
        const parsed = parseSheet(wb.Sheets[sn]);
        if(parsed && parsed.name) teamsFromFile.push(parsed);
      });
      if(!teamsFromFile.length){
        alert('Nessuna squadra trovata nel file. Controlla che ogni foglio abbia il nome squadra in cella A1 e i giocatori sotto (colonna A = numero, B = nome).');
        inputEl.value=''; return;
      }
      // indicizza le squadre attuali per nome normalizzato
      const current = [];
      GIRONI.forEach(g => toArr(S.squadre[g]).forEach((sq,i) => current.push({g, i, key: normName(sq.name)})));
      let updated = 0;
      const notFound = [];
      teamsFromFile.forEach(t => {
        const target = current.find(c => c.key === normName(t.name));
        if(target){
          S.squadre[target.g][target.i] = {
            name: S.squadre[target.g][target.i].name, // mantiene il nome esistente
            players: t.players.map(p=>({n:(p.n===undefined?'':p.n), name:p.name}))
          };
          updated++;
        } else {
          notFound.push(t.name);
        }
      });
      save(); renderSquadre();
      let msg = `Importate ${updated} squadre (rose aggiornate).`;
      if(notFound.length){
        msg += `\n\nNON trovate tra le squadre attuali (nome diverso): \n- ${notFound.join('\n- ')}\n\nControlla che il nome nel file coincida con quello inserito nei gironi.`;
      }
      alert(msg);
    } catch(err){
      console.error(err);
      alert('Errore durante la lettura del file Excel:\n' + err.message);
    }
    inputEl.value = ''; // reset, così puoi ricaricare lo stesso file
  };
  reader.onerror = () => { alert('Impossibile leggere il file.'); inputEl.value=''; };
  reader.readAsArrayBuffer(file);
}

          <span class="team-name right" style="font-size:13px">${tb||'\u2014'}</span>
        </div>
        <div class="cards-row">
          <span class="cards-info">\ud83d\udfe8 ${sc.giA} &nbsp; \ud83d\udfe5 ${sc.roA}</span>
          <button class="btn" style="font-size:12px;padding:5px 14px" onclick="openKOModal('${key}')">\u26bd Registra eventi</button>
          <span class="cards-info">\ud83d\udfe8 ${sc.giB} &nbsp; \ud83d\udfe5 ${sc.roB}</span>
        </div>
        ${winner}
      </div>`;
    }
    c.innerHTML=html;el.appendChild(c);
  });
}
function setMatchDt(key,val){mdata(key).dt=val;showCurrentTab();save();}
function setMatchPlayed(key,val){const m=mdata(key);m.played=!!val;if(val)m.live=false;showCurrentTab();save();}
function setMatchLive(key,val){const m=mdata(key);m.live=!!val;if(val)m.played=false;showCurrentTab();save();}
function setKOTeam(key,side,val){if(!S.koTeams[key])S.koTeams[key]={a:'',b:''};S.koTeams[key][side]=val;showCurrentTab();save();}

let CM=null;
function openMatchModal(key,g,ia,ib,tab){CM={key,ta:sqName(g,ia),tb:sqName(g,ib),pA:sqPlayers(g,ia),pB:sqPlayers(g,ib),tab};showModal();}
function openKOModal(key){const kt=(S.koTeams&&S.koTeams[key])||{};CM={key,ta:kt?.a||'Squadra A',tb:kt?.b||'Squadra B',pA:[],pB:[],tab:'ko'};showModal();}
function showModal(){
  const{ta,tb}=CM;
  document.getElementById('modal-inner').innerHTML=`
    <div class="modal-title">${ta} <span style="color:var(--text3);font-weight:400">vs</span> ${tb}</div>
    <div class="grid2">
      <div><div class="ev-panel-title">${ta}</div><div id="evf-A"></div><div id="evl-A" class="ev-list"></div></div>
      <div><div class="ev-panel-title">${tb}</div><div id="evf-B"></div><div id="evl-B" class="ev-list"></div></div>
    </div>
    <div style="text-align:right;margin-top:1rem"><button class="btn btn-accent" onclick="closeModal()">Chiudi</button></div>`;
  renderEvForm('A',CM.pA);renderEvForm('B',CM.pB);renderEvList('A');renderEvList('B');
  document.getElementById('modal-bg').classList.add('open');
}
function renderEvForm(side,players){
  const cont=document.getElementById(`evf-${side}`);
  const hasP=players&&players.length>0;
  let pSel=hasP
    ?`<select id="sel-p-${side}" style="font-size:12px;padding:5px 8px;margin-bottom:6px">${players.map(p=>`<option value="${playerLabel(p).replace(/"/g,'&quot;')}">${playerLabel(p)}</option>`).join('')}</select>`
    :`<input type="text" id="inp-p-${side}" placeholder="Nome giocatore" style="font-size:12px;padding:5px 8px;margin-bottom:6px">`;
  cont.innerHTML=`${pSel}<div class="ev-add-row">
    <select id="sel-t-${side}"><option value="gol">\u26bd Gol</option><option value="giallo">\ud83d\udfe8 Giallo</option><option value="rosso">\ud83d\udfe5 Rosso</option></select>
    <button class="btn btn-accent" onclick="addEv('${side}')">+ Aggiungi</button></div>`;
}
function getPlayer(side){const s=document.getElementById(`sel-p-${side}`);const i=document.getElementById(`inp-p-${side}`);return s?s.value:i?i.value.trim():'';}
function addEv(side){
  const player=getPlayer(side);if(!player)return;
  const type=document.getElementById(`sel-t-${side}`).value;
  const m=mdata(CM.key);(side==='A'?m.evA:m.evB).push({p:player,t:type});
  save();renderEvList(side);CM.tab==='gironi'?renderGironi():renderKO();
}
function removeEv(side,idx){
  const m=mdata(CM.key);(side==='A'?m.evA:m.evB).splice(idx,1);
  save();renderEvList(side);CM.tab==='gironi'?renderGironi():renderKO();
}
function renderEvList(side){
  const m=mdata(CM.key);const arr=(side==='A'?m.evA:m.evB)||[];
  const cont=document.getElementById(`evl-${side}`);if(!cont)return;
  if(!arr.length){cont.innerHTML=`<div class="ev-empty">Nessun evento</div>`;return;}
  cont.innerHTML=arr.map((e,i)=>`<div class="ev-item"><span>${e.t==='gol'?'\u26bd':e.t==='giallo'?'\ud83d\udfe8':'\ud83d\udfe5'} ${e.p}</span><button class="del-btn" style="font-size:14px" onclick="removeEv('${side}',${i})">\u00d7</button></div>`).join('');
}
function closeModal(){document.getElementById('modal-bg').classList.remove('open');CM=null;}

function getStandings(g){
  const st={};
  toArr(S.squadre[g]).forEach((_,i)=>{const n=sqName(g,i);st[n]={pts:0,pg:0,gs:0,gc:0,gd:0,gi:0,ro:0};});
  PAIRS.forEach(([a,b],i)=>{
    const key=mkey(`G${g}`,i);const m=mdata(key);if(!m.played)return;const sc=calcScore(m);
    const ta=sqName(g,a),tb=sqName(g,b);
    st[ta].pg++;st[tb].pg++;
    st[ta].gs+=sc.goA;st[ta].gc+=sc.goB;st[ta].gd+=sc.goA-sc.goB;
    st[tb].gs+=sc.goB;st[tb].gc+=sc.goA;st[tb].gd+=sc.goB-sc.goA;
    st[ta].gi+=sc.giA;st[ta].ro+=sc.roA;st[tb].gi+=sc.giB;st[tb].ro+=sc.roB;
    if(sc.goA>sc.goB)st[ta].pts+=3;else if(sc.goA<sc.goB)st[tb].pts+=3;else{st[ta].pts+=1;st[tb].pts+=1;}
  });
  return Object.entries(st).sort((a,b)=>b[1].pts-a[1].pts||b[1].gd-a[1].gd||b[1].gs-a[1].gs).map(([n,s])=>({n,...s}));
}
function renderClassifiche(){
  const el=document.getElementById('classifiche');el.innerHTML='';
  GIRONI.forEach(g=>{
    const st=getStandings(g);
    const c=document.createElement('div');c.className='card';
    let h=`<div class="card-title">Girone ${g}</div><table><thead><tr><th>#</th><th>Squadra</th><th>Pts</th><th>PG</th><th>GF</th><th>GS</th><th>\u00b1</th><th>\ud83d\udfe8</th><th>\ud83d\udfe5</th></tr></thead><tbody>`;
    st.forEach((t,i)=>{
      const cls=i===0?'tr-gold':i===1?'tr-silver':'';
      h+=`<tr class="${cls}"><td>${i+1}</td><td>${t.n}${i<2?` <span class="badge badge-qf">QF</span>`:''}</td><td><strong>${t.pts}</strong></td><td>${t.pg}</td><td>${t.gs}</td><td>${t.gc}</td><td>${t.gd>0?'+'+t.gd:t.gd}</td><td>${t.gi}</td><td>${t.ro}</td></tr>`;
    });
    h+=`</tbody></table>`;c.innerHTML=h;el.appendChild(c);
  });
}

function renderMarcatori(){
  const el=document.getElementById('marcatori');el.innerHTML='';
  const players={},teamCards={};
  const allKeys=[...GIRONI.flatMap(g=>PAIRS.map((_,i)=>mkey(`G${g}`,i))),...KO_PHASES.flatMap(ph=>Array.from({length:ph.n},(_,i)=>mkey(ph.phase,i)))];
  allKeys.forEach(key=>{
    const m=S.matches[key];if(!m||!m.played)return;
    const kt=(S.koTeams&&S.koTeams[key])||{};const parts=key.split('_');const phase=parts[0];const idx=parseInt(parts[1]);
    let ta='',tb='';
    if(phase.startsWith('G')){const g=phase[1];const p=PAIRS[idx];if(p){ta=sqName(g,p[0]);tb=sqName(g,p[1]);}}
    else{ta=kt?.a||'';tb=kt?.b||'';}
    [[m.evA||[],ta],[m.evB||[],tb]].forEach(([evs,team])=>{
      if(team&&!teamCards[team])teamCards[team]={gi:0,ro:0};
      const seenMatchPlayers=new Set();
      evs.forEach(e=>{
        const pk=`${e.p}|||${team||'?'}`;
        if(!players[pk])players[pk]={name:e.p,team:team||'?',gol:0,pg:0,_matches:new Set()};
        if(e.t==='gol')players[pk].gol++;
        if(e.t==='giallo'){if(team)teamCards[team].gi++;}
        if(e.t==='rosso'){if(team)teamCards[team].ro++;}
        players[pk]._matches.add(key);
      });
    });
  });
  Object.values(players).forEach(p=>{p.pg=p._matches.size;delete p._matches;});
  const sorted=Object.values(players).sort((a,b)=>b.gol-a.gol||a.pg-b.pg);
  const c1=document.createElement('div');c1.className='card';
  let h1=`<div class="card-title">Classifica Marcatori</div><table><thead><tr><th>#</th><th>Giocatore</th><th>Squadra</th><th style="text-align:center">\u26bd Gol</th><th style="text-align:center">PG</th></tr></thead><tbody>`;
  if(!sorted.length)h1+=`<tr><td colspan="5" style="color:var(--text3)">Nessun dato ancora</td></tr>`;
  sorted.forEach((p,i)=>{h1+=`<tr class="${i===0?'tr-gold':''}"><td>${i+1}</td><td><strong>${p.name}</strong></td><td style="color:var(--text2)">${p.team}</td><td style="text-align:center"><strong>${p.gol}</strong></td><td style="text-align:center">${p.pg}</td></tr>`;});
  h1+=`</tbody></table>`;c1.innerHTML=h1;el.appendChild(c1);
  const c2=document.createElement('div');c2.className='card';
  const tc=Object.entries(teamCards).sort((a,b)=>(b[1].gi+b[1].ro)-(a[1].gi+a[1].ro));
  let h2=`<div class="card-title">Cartellini per Squadra</div><table><thead><tr><th>Squadra</th><th>\ud83d\udfe8 Gialli</th><th>\ud83d\udfe5 Rossi</th><th>Totale</th></tr></thead><tbody>`;
  if(!tc.length)h2+=`<tr><td colspan="4" style="color:var(--text3)">Nessun dato ancora</td></tr>`;
  tc.forEach(([n,s])=>{h2+=`<tr><td>${n}</td><td>${s.gi}</td><td>${s.ro}</td><td><strong>${s.gi+s.ro}</strong></td></tr>`;});
  h2+=`</tbody></table>`;c2.innerHTML=h2;el.appendChild(c2);
}

function getAllTeams(){return GIRONI.flatMap(g=>toArr(S.squadre[g]).map((_,i)=>sqName(g,i)));}

function renderSocial(){
  const el=document.getElementById('social');el.innerHTML='';
  if(!S.social||typeof S.social!=='object')S.social={};
  const teams=getAllTeams();
  const sorted=[...teams].sort((a,b)=>socialGet(b)-socialGet(a));
  const c=document.createElement('div');c.className='card';
  let html=`<div class="card-title"><i class="ti ti-brand-instagram ig-icon" style="font-size:20px"></i> Coppa Social \u2014 Classifica Punti Social</div>
  <table><thead><tr><th style="width:36px">#</th><th>Squadra</th><th style="text-align:center"><i class="ti ti-brand-instagram ig-icon"></i> Tot.</th><th style="text-align:center;width:220px">Modifica</th></tr></thead><tbody>`;
  sorted.forEach((team,i)=>{
    const count=socialGet(team);
    const medal=i===0?'\ud83e\udd47':i===1?'\ud83e\udd48':i===2?'\ud83e\udd49':`${i+1}`;
    const rowCls=i===0?'tr-gold':i===1?'tr-silver':'';
    const teamEsc=team.replace(/'/g,"\\'").replace(/"/g,'&quot;');
    html+=`<tr class="${rowCls}">
      <td style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700">${medal}</td>
      <td><strong>${team}</strong></td>
      <td style="text-align:center"><input type="number" value="${count}" min="0" style="width:72px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:var(--yellow);background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:4px 6px" onchange="socialSetDirect('${teamEsc}',this.value)" onblur="socialSetDirect('${teamEsc}',this.value)"></td>
      <td style="text-align:center"><div style="display:flex;align-items:center;justify-content:center;gap:5px">
        <button class="btn" style="padding:4px 10px;font-size:18px;line-height:1" onclick="socialDelta('${teamEsc}',-1)">\u2212</button>
        <select id="social-qty-${i}" style="width:58px;padding:4px;font-size:13px;text-align:center"><option value="1">+1</option><option value="2">+2</option><option value="3">+3</option><option value="5">+5</option><option value="10">+10</option></select>
        <button class="btn btn-accent" style="padding:4px 12px;font-size:14px;font-weight:700" onclick="socialAdd('${teamEsc}',${i})">+</button>
      </div></td>
    </tr>`;
  });
  html+=`</tbody></table><div style="margin-top:1rem;text-align:center;font-size:12px;color:var(--text3)">Totale punti social torneo: <strong style="color:var(--text2)">${teams.reduce((sum,team)=>sum+socialGet(team),0)}</strong></div>`;
  c.innerHTML=html;el.appendChild(c);
}
function socialSetDirect(team,value){socialSet(team,Math.max(0,parseInt(value)||0));save();}
function socialAdd(team,rowIdx){const qty=parseInt(document.getElementById(`social-qty-${rowIdx}`)?.value||'1');socialSet(team,socialGet(team)+qty);save().then(renderSocial);}
function socialDelta(team,delta){socialSet(team,socialGet(team)+delta);save().then(renderSocial);}

function renderBanco(){
  const el=document.getElementById('banco');el.innerHTML='';
  if(!S.banco||typeof S.banco!=='object')S.banco={};
  const teams=getAllTeams();
  const sorted=[...teams].sort((a,b)=>bancoGet(b)-bancoGet(a));
  const c=document.createElement('div');c.className='card';
  let html=`<div class="card-title">\ud83c\udf7a Coppa Banco \u2014 Classifica Consumazioni</div>
  <table><thead><tr><th style="width:36px">#</th><th>Squadra</th><th style="text-align:center">\ud83c\udf7a Totale</th><th style="text-align:center;width:220px">Modifica</th></tr></thead><tbody>`;
  sorted.forEach((team,i)=>{
    const count=bancoGet(team);
    const medal=i===0?'\ud83e\udd47':i===1?'\ud83e\udd48':i===2?'\ud83e\udd49':`${i+1}`;
    const rowCls=i===0?'tr-gold':i===1?'tr-silver':'';
    const teamEsc=team.replace(/'/g,"\\'").replace(/"/g,'&quot;');
    html+=`<tr class="${rowCls}">
      <td style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700">${medal}</td>
      <td><strong>${team}</strong></td>
      <td style="text-align:center"><input type="number" value="${count}" min="0" style="width:72px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:var(--yellow);background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:4px 6px" onchange="bancoSetDirect('${teamEsc}',this.value)" onblur="bancoSetDirect('${teamEsc}',this.value)"></td>
      <td style="text-align:center"><div style="display:flex;align-items:center;justify-content:center;gap:5px">
        <button class="btn" style="padding:4px 10px;font-size:18px;line-height:1" onclick="bancoDelta('${teamEsc}',-1)">\u2212</button>
        <select id="banco-qty-${i}" style="width:58px;padding:4px;font-size:13px;text-align:center"><option value="1">+1</option><option value="2">+2</option><option value="3">+3</option><option value="5">+5</option><option value="10">+10</option></select>
        <button class="btn btn-accent" style="padding:4px 12px;font-size:14px;font-weight:700" onclick="bancoAdd('${teamEsc}',${i})">+</button>
      </div></td>
    </tr>`;
  });
  html+=`</tbody></table><div style="margin-top:1rem;text-align:center;font-size:12px;color:var(--text3)">Totale consumazioni torneo: <strong style="color:var(--text2)">${teams.reduce((sum,team)=>sum+bancoGet(team),0)}</strong></div>`;
  c.innerHTML=html;el.appendChild(c);
}
function bancoSetDirect(team,value){bancoSet(team,Math.max(0,parseInt(value)||0));save();}
function bancoAdd(team,rowIdx){const qty=parseInt(document.getElementById(`banco-qty-${rowIdx}`)?.value||'1');bancoSet(team,bancoGet(team)+qty);save().then(renderBanco);}
function bancoDelta(team,delta){bancoSet(team,bancoGet(team)+delta);save().then(renderBanco);}

const renders={squadre:renderSquadre,rose:renderRose,gironi:renderGironi,ko:renderKO,classifiche:renderClassifiche,marcatori:renderMarcatori,social:renderSocial,banco:renderBanco};
</script>
